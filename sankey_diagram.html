<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sankey Diagram</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #chart {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .node rect {
            cursor: move;
            fill-opacity: 0.9;
            shape-rendering: crispEdges;
        }
        .node text {
            pointer-events: none;
            text-shadow: 0 1px 0 #fff;
        }
        .link {
            fill: none;
            stroke: #000;
            stroke-opacity: 0.3;
        }
        .link:hover {
            stroke-opacity: 0.7;
        }
        .column-label {
            font-weight: bold;
            text-align: center;
            font-size: 18px;
        }
        text {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="chart"></div>

    <script>
        // Set up responsive dimensions
        const margin = {top: 5, right: 5, bottom: 5, left: 5};
        
        // Function to calculate dimensions based on viewport
        function getChartDimensions() {
            const chartContainer = document.getElementById('chart');
            const width = window.innerWidth - margin.left - margin.right - 10;
            const height = window.innerHeight - margin.top - margin.bottom - 10;
            return { width, height };
        }
        
        // Get initial dimensions
        const { width, height } = getChartDimensions();

        // Parse the data
        const data = [
            // Skip header row (index 0) and start from row 1
            ["Internacional", "2021", "Aluno PG", "Cell & Molec Biol (UPE)", "Rita Cássia Moura", "Adriana Souza Melo"],
            ["Internacional", "2024", "Docente", "Brazil Confer. MIT, Harvard", "Isabelle F.T. Viana", "Isabelle F.T. Viana"],
            ["Nacional", "2022", "Aluno PG", "GENETICA 2022 (SBG)", "Ana Christina B. Vidal", "Palloma Lima Oliveira"],
            ["Nacional", "2022", "Aluno PG", "GENETICA 2022 (SBG)", "Ana Benko-Iseppon", "Wilson Dias Oliveira"],
            ["Nacional", "2022", "Aluno IC", "GENETICA 2022 (SBG)", "Valesca Pandolfi", "Vinicius S.P.S. Sobral"],
            ["Nacional", "2023", "Docente", "CSB Parasitologia (SBP)", "Tatiany R.P. Melo", "Tatiany R.P. Melo"],
            ["Regional", "2021", "Aluno IC", "ENGENE (SBG)", "Ana Christina B. Vidal", "Camila Marinho Silva"],
            ["Regional", "2021", "Aluno IC", "ENGENE (SBG)", "Ana Benko Iseppon", "Laura M. R. Paixão"],
            ["Regional", "2021", "Docente", "Acad Pernamb Ciênc", "Ana Benko Iseppon", "Ana Benko Iseppon"],
            ["Regional", "2021", "Aluno PG", "ENGENE (SBG)", "Ana Christina B. Vidal", "Cláudio Montenegro Jr"],
            ["Regional", "2022", "Docente", "III Biomed (Cons Fed Biol)", "Marcos A.C. Bezerra", "Marcos A.C. Bezerra"],
            ["Regional", "2023", "Aluno IC", "ENGENE (SBG)", "Ana Christina B. Vidal", "Albean S.C. Bezerra"],
            ["Regional", "2023", "Aluno IC", "ENGENE (SBG)", "Paula Sandrin Garcia", "Ana Beatriz B. Abreu"],
            ["Regional", "2023", "Aluno IC", "ENGENE (SBG)", "Rafael L. Guimarães", "Henrique F.L. Araújo"],
            ["Regional", "2023", "Aluno IC", "ENGENE (SBG)", "Vilma Loreto Silva", "Marcelye M.F. Silva"],
            ["Regional", "2023", "Aluno PG", "ENGENE (SBG)", "Ana Christina B. Vidal", "Marcos V. Cosme"],
            ["Regional", "2023", "Aluno PG", "X JPG FIOCRUZ", "Tereza C.L. Balbino", "Kamylle C. Silva"],
            ["Regional", "2024", "Aluno IC", "IX Esc Inv Biotec-USP", "Osvaldo P. Melo Nt", "Thamires F. Santos"],
            ["Regional", "2024", "Aluno IC", "Reun-Anu-IC FIOCRUZ", "Osvaldo P.Melo Nt", "Thamires F. Santos"],
            ["Regional", "2024", "Aluno IC", "SNNB (UNIVASF)", "Ana Christina B. Vidal", "Albean S.C. Bezerra"],
            ["Regional", "2024", "Docente", "Câmara Munic. Recife", "Ana Benko Iseppon", "Ana Benko Iseppon"],
            ["Regional", "2024", "Aluno PG", "III Encontro PPGCB", "Jaqueline Azevedo Silva", "Mariana S.B. Cavalcanti"],
            ["Regional", "2024", "Aluno PG", "Semana Universit. UPE", "Rita Cássia Moura", "LIliane L. Mota"]
        ];

        // Format data for Sankey diagram according to the specified order
        // Abrangência -> Vínculo -> Evento -> Orientador -> Premiado
        const nodes = [];
        const links = [];
        const nodeMap = {};

        // Helper function to get node index
        function getNodeIndex(name, type) {
            const key = `${type}:${name}`;
            if (!(key in nodeMap)) {
                nodeMap[key] = nodes.length;
                nodes.push({ name, type });
            }
            return nodeMap[key];
        }

        // Process data
        data.forEach(d => {
            const abrangencia = d[0];
            const vinculo = d[2];
            const evento = d[3];
            const orientador = d[4];
            const premiado = d[5];
            
            const abrangenciaIndex = getNodeIndex(abrangencia, 'abrangencia');
            const vinculoIndex = getNodeIndex(vinculo, 'vinculo');
            const eventoIndex = getNodeIndex(evento, 'evento');
            const orientadorIndex = getNodeIndex(orientador, 'orientador');
            const premiadoIndex = getNodeIndex(premiado, 'premiado');
            
            // Create links according to the specified order
            links.push({ source: abrangenciaIndex, target: vinculoIndex, value: 1 });
            links.push({ source: vinculoIndex, target: eventoIndex, value: 1 });
            links.push({ source: eventoIndex, target: orientadorIndex, value: 1 });
            links.push({ source: orientadorIndex, target: premiadoIndex, value: 1 });
        });

        // Set up responsive SVG
        const svg = d3.select("#chart").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", `0 0 ${width + margin.left + margin.right + 60} ${height + margin.top + margin.bottom}`)
            .attr("preserveAspectRatio", "xMidYMid meet")
            .append("g")
            .attr("transform", `translate(${margin.left + 30},${margin.top})`);
            
        // Add resize listener
        window.addEventListener('resize', function() {
            // Update viewBox on resize
            const newDimensions = getChartDimensions();
            d3.select("svg")
                .attr("viewBox", `0 0 ${newDimensions.width + margin.left + margin.right + 60} ${newDimensions.height + margin.top + margin.bottom}`);
        });

        // Set up the Sankey diagram
        const sankey = d3.sankey()
            .nodeWidth(20)  // Wider nodes
            .nodePadding(12) // More padding between nodes
            .extent([[5, 30], [width - 5, height - 5]]);

        // Apply settings to the Sankey layout
        const sankeyData = sankey({
            nodes: nodes.map(d => Object.assign({}, d)),
            links: links.map(d => Object.assign({}, d))
        });

        // Define color scale with shades of orange (lighter to darker)
        const colorScale = d3.scaleOrdinal()
            .domain(['abrangencia', 'vinculo', 'evento', 'orientador', 'premiado'])
            .range([
                '#ffab5e', // Light orange
                '#ff9636', // Lighter orange
                '#ff8109', // Medium orange
                '#e06800', // Darker orange
                '#b85500'  // Darkest orange
            ]);
            
        // Calculate positions of nodes by type
        const nodePositionsByType = {};
        sankeyData.nodes.forEach(node => {
            if (!nodePositionsByType[node.type]) {
                nodePositionsByType[node.type] = { xMin: Infinity, xMax: -Infinity };
            }
            nodePositionsByType[node.type].xMin = Math.min(nodePositionsByType[node.type].xMin, node.x0);
            nodePositionsByType[node.type].xMax = Math.max(nodePositionsByType[node.type].xMax, node.x0);
        });
        
        // Define column labels with dynamic positioning and edge protection
        const columnLabels = [
            { text: "Abrangência", type: 'abrangencia' },
            { text: "Vínculo", type: 'vinculo' },
            { text: "Evento", type: 'evento' },
            { text: "Orientador", type: 'orientador' },
            { text: "Premiado", type: 'premiado' }
        ].map((label, index) => {
            const position = nodePositionsByType[label.type];
            let x = position ? (position.xMin + position.xMax) / 2 : 0;
            
            // Add extra margin for first and last label to prevent being cut off
            if (index === 0) {
                x = Math.max(x, 60); // Ensure Abrangência is not too far left
            } else if (index === 4) {
                x = Math.min(x, width - 60); // Ensure Premiado is not too far right
            }
            
            return {
                ...label,
                x: x
            };
        });

        // Draw the links
        const link = svg.append("g")
            .selectAll(".link")
            .data(sankeyData.links)
            .enter().append("path")
            .attr("class", "link")
            .attr("d", d3.sankeyLinkHorizontal())
            .attr("stroke-width", d => Math.max(1, d.width))
            .style("stroke", d => {
                // Use a gradient-like coloring for links
                const sourceColor = d3.color(colorScale(nodes[d.source.index].type));
                const targetColor = d3.color(colorScale(nodes[d.target.index].type));
                // Create a slightly darker version of the source color for better visibility
                return sourceColor.darker(0.3);
            });

        // Add hover title on links
        link.append("title")
            .text(d => `${nodes[d.source.index].name} → ${nodes[d.target.index].name}`);

        // Draw the nodes
        const node = svg.append("g")
            .selectAll(".node")
            .data(sankeyData.nodes)
            .enter().append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.x0},${d.y0})`);

        // Add rectangles for nodes
        node.append("rect")
            .attr("height", d => d.y1 - d.y0)
            .attr("width", d => d.x1 - d.x0)
            .style("fill", d => colorScale(d.type))
            .style("stroke", d => d3.color(colorScale(d.type)).darker(0.5))
            .append("title")
            .text(d => `${d.name} (${d.type})`);

        // Add labels for the nodes
        node.append("text")
            .attr("x", d => {
                // Special handling for "vinculo" and "evento" nodes - always position text to the left
                if (d.type === 'vinculo' || d.type === 'evento') {
                    return -6; // Left-aligned for these nodes
                }
                // Adjust x position to prevent text from being cut off on edges
                else if (d.x0 < width * 0.25) {
                    return (d.x1 - d.x0) + 6; // Right-aligned for leftmost nodes
                } else if (d.x0 > width * 0.75) {
                    return -6; // Left-aligned for rightmost nodes
                } else {
                    return d.x0 < width / 2 ? (d.x1 - d.x0) + 6 : -6; // Default positioning
                }
            })
            .attr("y", d => (d.y1 - d.y0) / 2)
            .attr("dy", "0.35em")
            .attr("text-anchor", d => {
                // Special handling for "vinculo" and "evento" nodes - always position text to the left
                if (d.type === 'vinculo' || d.type === 'evento') {
                    return "end"; // Right-align text that's positioned to the left of node
                }
                // Adjust text anchor to prevent text from being cut off on edges
                else if (d.x0 < width * 0.25) {
                    return "start"; // Right-aligned for leftmost nodes
                } else if (d.x0 > width * 0.75) {
                    return "end"; // Left-aligned for rightmost nodes
                } else {
                    return d.x0 < width / 2 ? "start" : "end"; // Default positioning
                }
            })
            .text(d => d.name)
            .style("font-size", "16px") // Increased font size
            .filter(d => (d.x1 - d.x0) > 60) // Further lower threshold to show more text
            .append("tspan")
            .attr("fill-opacity", 0.7);

        // Add column labels at the top
        svg.selectAll(".column-label")
            .data(columnLabels)
            .enter()
            .append("text")
            .attr("class", "column-label")
            .attr("x", d => d.x)
            .attr("y", 15)
            .attr("text-anchor", "middle")
            .text(d => d.text)
            .style("fill", (d, i) => colorScale(['abrangencia', 'vinculo', 'evento', 'orientador', 'premiado'][i]))
            .style("font-size", "22px");
            
        // Add connecting arrows between labels
        svg.selectAll(".column-arrow")
            .data(columnLabels.slice(0, columnLabels.length - 1))
            .enter()
            .append("text")
            .attr("x", (d, i) => d.x + (columnLabels[i + 1].x - d.x) / 2)
            .attr("y", 15)
            .attr("text-anchor", "middle")
            .text("→")
            .style("font-weight", "bold")
            .style("font-size", "22px");
    </script>
</body>
</html>
